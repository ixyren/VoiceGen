[package]
name = "voicegen"
version = "0.2.0"
description = "VoiceGen — Estudio de generación de voz TTS para Loquendo, SAPI 5 y OneCore"
authors = ["ixyren"]
edition = "2021"

[lib]
name = "voicegen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
mp3lame-encoder = "0.2"
